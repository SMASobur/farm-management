spring.application.name=farm-management

# ============ Server ============
server.port=8080

# ============ Database (Neon) ============
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============ JPA / Hibernate ============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============ Default Farm Bootstrap ============
farm.default.code=DEFAULT
farm.default.name=Default Farm
farm.default.owner-name=Administrator

# ============ JWT ============
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
jwt.issuer=farm-management

# ============ Default Admin (created on first startup if none exists) ============
# Note: The seeder only creates this user if the users table is EMPTY.
# If you register a user first, the seeder is skipped.
farm.default.admin-username=admin
farm.default.admin-password=admin123
farm.default.admin-full-name=Farm Administrator

cors.allowed-origins=http://localhost:5173,http://localhost:3000