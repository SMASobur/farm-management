# ============ Server ============
# Render injects PORT as env var; fallback to 8080 for local dev
server.port=${PORT:8080}

# ============ Database ============
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============ JPA / Hibernate ============
# In prod, use 'update' for now ? later, switch to 'validate' with Flyway
spring.jpa.hibernate.ddl-auto=update
# Turn off SQL logging in production (it's slow)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ============ Default Farm Bootstrap ============
farm.default.code=DEFAULT
farm.default.name=Default Farm
farm.default.owner-name=Administrator

# ============ JWT ============
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
jwt.issuer=farm-management

# ============ Default Admin (only seeded if users table is EMPTY) ============
# In production, this creates the first admin; CHANGE THE PASSWORD AFTER FIRST LOGIN
farm.default.admin-username=${ADMIN_USERNAME:admin}
farm.default.admin-password=${ADMIN_PASSWORD:changeme-immediately}
farm.default.admin-full-name=Farm Administrator

# ============ CORS (add production frontend URL later) ============
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ============ Logging (quieter in prod) ============
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO